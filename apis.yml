aid: payzen
name: PayZen
description: >-
  PayZen is a San Francisco-based healthcare fintech that provides AI-powered patient
  financing — "Care Now, Pay Later" — for hospitals, health systems and large physician
  groups. Its platform underwrites each patient's ability to pay and issues interest-free,
  fee-free monthly payment plans and a white-labelable Care Card, with the provider paid
  up front. PayZen markets pre-built integrations with Epic, Cerner and other major EHR
  systems and is listed on Epic's Showroom (formerly App Orchard) marketplace, but it
  publishes no public developer portal, API reference or machine-readable contract: the
  integration surface is delivered to contracted health systems through the EHR
  marketplace and an implementation engagement. PayZen LLC is a licensed lender (NMLS
  2591891), is SOC 2 Type II certified and operates a Vanta trust portal.
